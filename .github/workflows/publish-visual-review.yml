name: Publish visual review comment

on:
  workflow_run:
    workflows: ["Pull request code quality"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: visual-review-assets
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cogsmith-visual-review-pr-${{ env.PR_NUMBER }}
          path: incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate screenshot names and contents
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          pr = os.environ["PR_NUMBER"]
          versions = ("base", "head")
          views = ("desktop", "mobile")
          captures = ("full-page", "summary", "results")
          expected = {
              f"pr-{pr}-{version}-{view}-{capture}.png"
              for version in versions
              for view in views
              for capture in captures
          }
          incoming = Path("incoming")
          actual = {path.name for path in incoming.iterdir() if path.is_file()}

          if actual != expected:
              raise SystemExit(f"Unexpected screenshot set: {sorted(actual ^ expected)}")

          for name in expected:
              if (incoming / name).read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG signature: {name}")
          PY

      - name: Check out repository for asset branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          path: assets

      - name: Publish this PR's screenshots
        working-directory: assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin visual-review-assets; then
            git switch --create visual-review-assets --track origin/visual-review-assets
          else
            git switch --orphan visual-review-assets
            git rm -r --ignore-unmatch .
          fi

          destination="pr-${PR_NUMBER}"
          mkdir -p "$destination"
          find "$destination" -maxdepth 1 -type f -name "pr-${PR_NUMBER}-*.png" -delete
          cp ../incoming/pr-${PR_NUMBER}-*.png "$destination/"

          git add -- "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update visual review for PR #${PR_NUMBER}"
          git push origin HEAD:visual-review-assets

      - name: Create or update visual review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          root="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/visual-review-assets/pr-${PR_NUMBER}"
          suffix="?sha=${HEAD_SHA}"

          cat > comment.md <<EOF
          <!-- cogsmith-visual-review -->
          ## Visual review

          ### Full page

          | Main | Pull request |
          |---|---|
          | ![Main desktop](${root}/pr-${PR_NUMBER}-base-desktop-full-page.png${suffix}) | ![PR desktop](${root}/pr-${PR_NUMBER}-head-desktop-full-page.png${suffix}) |
          | ![Main mobile](${root}/pr-${PR_NUMBER}-base-mobile-full-page.png${suffix}) | ![PR mobile](${root}/pr-${PR_NUMBER}-head-mobile-full-page.png${suffix}) |

          <details>
          <summary>Summary cards and results table</summary>

          #### Summary cards

          | Main | Pull request |
          |---|---|
          | ![Main desktop summary](${root}/pr-${PR_NUMBER}-base-desktop-summary.png${suffix}) | ![PR desktop summary](${root}/pr-${PR_NUMBER}-head-desktop-summary.png${suffix}) |
          | ![Main mobile summary](${root}/pr-${PR_NUMBER}-base-mobile-summary.png${suffix}) | ![PR mobile summary](${root}/pr-${PR_NUMBER}-head-mobile-summary.png${suffix}) |

          #### Results table

          | Main | Pull request |
          |---|---|
          | ![Main desktop results](${root}/pr-${PR_NUMBER}-base-desktop-results.png${suffix}) | ![PR desktop results](${root}/pr-${PR_NUMBER}-head-desktop-results.png${suffix}) |
          | ![Main mobile results](${root}/pr-${PR_NUMBER}-base-mobile-results.png${suffix}) | ![PR mobile results](${root}/pr-${PR_NUMBER}-head-mobile-results.png${suffix}) |

          </details>

          Updated for commit \`${HEAD_SHA}\`.
          EOF

          jq -Rs '{body: .}' comment.md > comment.json
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- cogsmith-visual-review -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input comment.json
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input comment.json
          fi
