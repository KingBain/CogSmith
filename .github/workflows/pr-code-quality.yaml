name: Pull request code quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Validate source files
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

  unit-tests:
    name: Test application modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  webmcp-validation:
    name: Test native WebMCP integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Show Chrome version
        run: google-chrome --version

      - name: Run native WebMCP smoke test
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cogsmith-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          curl --fail             --retry 10             --retry-connrefused             --retry-delay 1             http://127.0.0.1:4173/ > /dev/null

          npx --yes webmcp-evals@0.0.4 smoke             --url http://127.0.0.1:4173/             --evals test/webmcp-smoke.json             --chrome-channel chrome             --timeout 60000             --verbose

  browser-validation:
    name: Test application and generate screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out main branch version
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-review/base

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:smoke

      - name: Capture visual comparison
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: npm run visual-review -- .visual-review/base .

      - name: Pass screenshots to comment publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cogsmith-visual-review-pr-${{ github.event.number }}
          path: visual-review/*.png
          retention-days: 1
