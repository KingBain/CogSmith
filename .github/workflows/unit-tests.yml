name: Unit tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  calculator:
    name: Calculator engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run unit tests
        run: npm test
