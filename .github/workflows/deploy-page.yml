# Reusable workflow for deploying a released version to GitHub Pages
name: Deploy static content to Pages

on:
  workflow_call:
    inputs:
      release_sha:
        description: Commit SHA tagged by Release Please
        required: true
        type: string

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Stamp deployment metadata
        env:
          COGSMITH_BUILD_ID: ${{ inputs.release_sha }}
        run: npm run stamp-build -- "$COGSMITH_BUILD_ID"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
