name: Clean up visual review images

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: visual-review-assets
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Remove only this PR's screenshots
        run: |
          if ! git fetch origin visual-review-assets; then
            exit 0
          fi

          git switch --create visual-review-assets --track origin/visual-review-assets
          directory="pr-${PR_NUMBER}"

          if [ ! -d "$directory" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -- "$directory"
          git commit -m "Remove visual review for PR #${PR_NUMBER}"
          git push origin HEAD:visual-review-assets
